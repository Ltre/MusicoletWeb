name: Initial Development CI

# The committed go.mod/go.sum must remain tidy and reproducible on the real toolchain.
on:
  push:
    branches:
      - dev-2609A-GPTCHAT
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false

      - name: Resolve real Go dependencies
        run: go mod tidy

      - name: Ensure go.mod stays stable
        run: git diff --exit-code -- go.mod

      - name: Unit tests
        run: go test ./...

      - name: Go vet
        run: go vet ./...

      - name: SQLite and service integration tests
        run: go test -tags=integration ./internal/db ./internal/musicolet ./internal/app ./internal/httpapi

      - name: JavaScript syntax
        run: |
          for f in web/*.js; do
            node --check "$f"
          done

      - name: Build source snapshot for private real-backup E2E
        run: |
          go mod vendor
          tar --exclude=.git --exclude=data -czf /tmp/musicoletweb-source.tar.gz .

      - name: Upload source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: source-snapshot
          path: /tmp/musicoletweb-source.tar.gz
          if-no-files-found: error
          retention-days: 1

      - name: Upload generated go.sum
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generated-go-sum
          path: go.sum
          if-no-files-found: error
