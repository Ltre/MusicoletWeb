upstream musicolet_backend {
    server 127.0.0.1:4001;
    keepalive 32;
}

server {
    listen 80;
    server_name musicolet.miku.us;

    access_log /home/wwwlogs/musicolet.miku.us_nginx.log combined;

    # ============================================================
    # 强制 HTTPS
    #
    # Nginx 本身不配置 SSL，HTTPS 由 Cloudflare 等前置代理提供。
    # Cloudflare HTTPS -> HTTP 回源时会携带 X-Forwarded-Proto: https，
    # 此时不能再次重定向，否则可能形成循环。
    # ============================================================
    if ($http_x_forwarded_proto != "https") {
        return 301 https://$host$request_uri;
    }


    # ============================================================
    # 媒体文件
    # 浏览器缓存 30 天
    # 禁止站外盗链
    # 关闭 access_log
    # ============================================================
    location ~* \.(gif|jpe?g|png|bmp|swf|flv|mp4|ico|wma|wmv|asf|mp3|mmf|zip|rar|m4a|aac|flac)$ {

        # 只允许 miku.us / larele.com 及其子域名引用。
        #
        # 注意：
        # 没有 Referer 的直接访问也会被判定为盗链。
        valid_referers
            miku.us
            *.miku.us
            larele.com
            *.larele.com;

        if ($invalid_referer) {
            return 403;
        }

        expires 30d;

        access_log off;
        log_not_found off;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

        proxy_pass http://musicolet_backend;
    }


    # ============================================================
    # 前端静态资源
    # 浏览器缓存 7 天
    # 关闭 access_log
    # ============================================================
    location ~* \.(js|css|map|woff|woff2|ttf|otf|eot|svg)$ {
        expires 7d;

        access_log off;
        log_not_found off;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

        proxy_pass http://musicolet_backend;
    }


    # ============================================================
    # 其它动态请求 / HTML 页面
    # ============================================================
    location / {
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

        proxy_pass http://musicolet_backend;
    }
}
