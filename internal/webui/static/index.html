<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b1520">
  <title>MusicoletWeb</title>
  <link rel="stylesheet" href="/app.css">
  <link rel="stylesheet" href="/public.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <section id="login" class="login-shell hidden" aria-label="管理员登录">
    <form id="login-form" class="login-card">
      <div class="brand-mark">M</div><h1>MusicoletWeb</h1><p>管理员登录</p>
      <label>账号<input name="username" autocomplete="username" required></label>
      <label>密码<input name="password" type="password" autocomplete="current-password" required></label>
      <label>Google Authenticator<input name="totp" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="6 位验证码"></label>
      <button class="primary" type="submit">登录</button><output id="login-error"></output>
    </form>
  </section>
  <div id="app" class="app hidden">
    <header class="topbar">
      <div class="brand"><span class="brand-mark small">M</span><span>MusicoletWeb</span></div>
      <nav id="tabs" class="tabs" aria-label="主导航">
        <button data-tab="queues">播放队列</button><button data-tab="now">正在播放</button><button data-tab="folders">文件夹</button><button data-tab="albums">专辑列表</button><button data-tab="artists">艺术家列表</button><button data-tab="genres">风格</button><button data-tab="playlists">歌曲清单</button><button data-tab="search">搜索</button><button data-tab="menu">☰</button>
      </nav>
      <div class="status"><span id="version-badge">尚未导入</span><span id="agent-badge">手机离线</span></div>
    </header>
    <main id="main" tabindex="-1"></main>
    <footer id="mini-player" class="mini-player">
      <button id="mini-cover" class="cover tiny">♪</button><div class="mini-meta"><strong id="mini-title">未在播放</strong><span id="mini-artist">—</span></div><button id="mini-prev" aria-label="上一曲">⏮</button><button id="mini-play" class="play-round" aria-label="播放或暂停">▶</button><button id="mini-next" aria-label="下一曲">⏭</button>
      <audio id="audio" preload="metadata"></audio>
    </footer>
  </div>
  <dialog id="modal"><div id="modal-body"></div><form method="dialog"><button class="ghost modal-close">完成</button></form></dialog>
  <div id="toast" role="status" aria-live="polite"></div>
</body>
</html>
